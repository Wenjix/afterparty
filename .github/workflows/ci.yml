name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep shellcheck
      - name: syntax
        run: |
          for f in skills/afterparty/lib/*.sh bin/afterparty skills/afterparty/bin/afterparty tests/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck (errors block)
        run: shellcheck --severity=error skills/afterparty/lib/*.sh
      - name: shellcheck (advisory)
        run: shellcheck skills/afterparty/lib/*.sh || true
      - name: tests (includes live kill coverage)
        run: bash tests/run.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: transcript compatibility (native Python and Git Bash)
        run: |
          bash tests/test-transcript-index.sh
          bash tests/test-codex-integration.sh
      - name: tests (Git Bash, kill suite self-skips)
        run: bash tests/run.sh
